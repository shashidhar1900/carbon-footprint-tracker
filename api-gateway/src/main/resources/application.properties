spring.application.name=api-gateway

server.port=8961

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
eureka.client.serviceUrl.defaultZone=http://service-registry:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=api-gateway

spring.main.web-application-type=reactive
spring.main.allow-bean-definition-overriding=true

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.urls[0].name=Analytics Service
springdoc.swagger-ui.urls[0].url=/analytics-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Auth Service
springdoc.swagger-ui.urls[1].url=/auth-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Energy Service
springdoc.swagger-ui.urls[2].url=/energy-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Food Service
springdoc.swagger-ui.urls[3].url=/food-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=Leaderboard Service
springdoc.swagger-ui.urls[4].url=/leaderboard-service/v3/api-docs
springdoc.swagger-ui.urls[5].name=Transport Service
springdoc.swagger-ui.urls[5].url=/transport-service/v3/api-docs

server.forward-headers-strategy=framework
spring.webflux.forwarded-prefix.enabled=true


# Enable CORS handling for all requests at gateway level
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# Define global CORS configuration for all routes [/**]
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:8961
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.default-filters=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin


# Logging (useful for debugging)
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.reactor.netty.http.server=DEBUG

# Enable Feign to use service discovery (Eureka)
feign.hystrix.enabled=false
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

# Optional: if using Ribbon (Spring Cloud LoadBalancer) for Feign via Eureka
spring.cloud.loadbalancer.ribbon.enabled=false

